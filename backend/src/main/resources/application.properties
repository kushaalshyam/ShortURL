spring.application.name=ShortURL

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/shorturl
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.cache.type=redis
spring.cache.redis.time-to-live=86400000

management.endpoints.web.exposure.include=metrics,caches,health
management.endpoint.metrics.enabled=true

app.base_url=http://localhost:8080